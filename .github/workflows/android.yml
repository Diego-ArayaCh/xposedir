name: Android APK

on:
  push:
    branches: [Android, main]
  pull_request:
    branches: [Android, main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      XPOSEDIR_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '/tmp/keystore.jks' || '' }}
      XPOSEDIR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      XPOSEDIR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      XPOSEDIR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: sdkmanager --licenses <<< "y" || true

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms/android-36" "build-tools/36.0.0" \
                    "ndk/27.0.12077973" "cmake/3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore Node.js runtime cache
        id: node-cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/capawesome-capacitor-nodejs
          key: nodejs-mobile-18.20.4

      - run: npm ci

      - name: Verify the server without a device
        run: |
          npm run android:assets
          node scripts/smoke-server.mjs

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Restore keystore
        if: env.XPOSEDIR_KEYSTORE != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.jks

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Save Node.js runtime cache
        if: always() && steps.node-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/caches/capawesome-capacitor-nodejs
          key: nodejs-mobile-18.20.4

      - uses: actions/upload-artifact@v4
        with:
          name: xposedir-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error